<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Adivina el número</title>
<style>
  body {
    font-family: sans-serif;
    background: #1e1e2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  #contenedor {
    background: #2a2a3d;
    padding: 30px 40px;
    border-radius: 12px;
    text-align: center;
    min-width: 300px;
  }
  input {
    padding: 8px;
    font-size: 16px;
    width: 100px;
    text-align: center;
    border-radius: 6px;
    border: none;
    margin-right: 8px;
  }
  button {
    padding: 8px 16px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    background: #5865f2;
    color: white;
    cursor: pointer;
  }
  button:hover {
    background: #4752c4;
  }
  #mensaje {
    margin-top: 20px;
    font-size: 20px;
    min-height: 28px;
  }
  #intentos {
    margin-top: 10px;
    color: #aaa;
  }
</style>
</head>
<body>

  <div id="contenedor">
    <h1>Adivina el número</h1>
    <p>Estoy pensando un número entre 1 y 100</p>

    <input type="number" id="guess" min="1" max="100" placeholder="?">
    <button id="btnGuess">Adivinar</button>

    <div id="mensaje"></div>
    <div id="intentos"></div>

    <button id="btnReiniciar" style="display:none; margin-top:15px;">Jugar otra vez</button>
  </div>

  <script src="juego.js"></script>
</body>
</html>
